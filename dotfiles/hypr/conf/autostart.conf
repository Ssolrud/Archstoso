# Start Listeners (GTK theme sync, battery notifications)
exec-once=~/.config/archstoso/listeners.sh --startall

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Wallpaper (swww-daemon must start before wallpaper-restore)
exec-once = swww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Load Status Bar
exec-once = ~/.config/waybar/launch.sh

# Load Notification Daemon
exec-once = swaync

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Autostart apps
exec-once = ~/.config/archstoso/scripts/archstoso-autostart

# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh
