#
# Hyprland Configuration
# https://wiki.hyprland.org/

# -----------------------------------------------------
# Core (monitor, cursor, keyboard, layout, misc)
# -----------------------------------------------------
source = ~/.config/hypr/conf/core.conf

# -----------------------------------------------------
# Environment Variables
# -----------------------------------------------------
source = ~/.config/hypr/conf/environment.conf

# -----------------------------------------------------
# Load color file (Matugen-generated)
# -----------------------------------------------------
source = ~/.config/hypr/colors.conf
$primary = $primary
$on_surface = $on_surface

# -----------------------------------------------------
# Autostart
# -----------------------------------------------------
source = ~/.config/hypr/conf/autostart.conf

# -----------------------------------------------------
# Appearance (decorations, animations)
# -----------------------------------------------------
source = ~/.config/hypr/conf/appearance.conf

# -----------------------------------------------------
# Keybindings
# -----------------------------------------------------
source = ~/.config/hypr/conf/keybindings.conf

# -----------------------------------------------------
# Window Rules
# -----------------------------------------------------
source = ~/.config/hypr/conf/windowrules.conf

# -----------------------------------------------------
# XDG Desktop Portal
# -----------------------------------------------------
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# -----------------------------------------------------
# Custom (user overrides — edit this file freely)
# -----------------------------------------------------
source = ~/.config/hypr/conf/custom.conf
